name: Update hero builds

# Runs every day after the dataset refresh (03:17 UTC), but the script only
# rebuilds when due: weekly, on a new patch, on a roster change or when forced.
# ~640 STRATZ requests (~25 min) per rebuild, inside the token's limits.
on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the builds are current
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Same group as the dataset refresh: the two jobs never push at the same time.
concurrency:
  group: dota-dataset-update
  cancel-in-progress: false

jobs:
  builds:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build hero builds from STRATZ (only when due)
        env:
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          if [ "$FORCE" = "true" ]; then
            node scripts/update-builds-stratz.mjs --force
          else
            node scripts/update-builds-stratz.mjs
          fi

      - name: Detect changes
        id: diff
        run: |
          git add -N public/builds
          if git diff --quiet -- public/builds; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Builds unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test, typecheck and build the app
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/builds
          git commit -m "chore(builds): refresh hero builds ($(date -u +%F))"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "::error::Could not push the builds after 3 attempts."
          exit 1
