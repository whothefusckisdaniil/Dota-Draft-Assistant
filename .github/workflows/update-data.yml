name: Update Dota dataset

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Refresh even if the complete STRATZ window has not changed
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dota-dataset-update
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      refresh_required: ${{ steps.check.outputs.refresh_required }}
      reason: ${{ steps.check.outputs.reason }}
      detected_patch: ${{ steps.check.outputs.detected_patch }}
      window_changed: ${{ steps.check.outputs.window_changed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Check whether a safe refresh is due
        id: check
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_refresh || false }}
        run: node scripts/check-data-refresh.mjs

  refresh:
    needs: preflight
    if: needs.preflight.outputs.refresh_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Refuse recovery or leftover staging directories
        run: |
          for directory in public/data.__next public/data.__prev; do
            if [ -e "$directory" ]; then
              echo "::error::Unexpected dataset publisher directory exists: $directory"
              exit 1
            fi
          done

      - name: Fingerprint the currently published dataset
        id: before
        run: echo "fingerprint=$(node scripts/dataset-fingerprint.mjs public/data)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Refresh dataset (OpenDota metadata + STRATZ snapshot)
        env:
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
        run: npm run update:data

      - name: Verify the published snapshot and STRATZ production contract
        run: node scripts/verify-dataset.mjs

      - name: Check for leftover publisher directories
        run: |
          for directory in public/data.__next public/data.__prev; do
            if [ -e "$directory" ]; then
              echo "::error::Dataset publisher left an unexpected directory: $directory"
              exit 1
            fi
          done

      - name: Test application against the refreshed dataset
        run: npm test

      - name: Typecheck application
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Avoid generatedAt-only commits
        id: fingerprint
        run: |
          after_fingerprint=$(node scripts/dataset-fingerprint.mjs public/data)
          echo "after_fingerprint=$after_fingerprint" >> "$GITHUB_OUTPUT"
          if [ "$after_fingerprint" = "${{ steps.before.outputs.fingerprint }}" ]; then
            echo "semantically_changed=false" >> "$GITHUB_OUTPUT"
            echo "Dataset semantically unchanged — restoring the committed snapshot."
            git restore --source=HEAD -- public/data
          else
            echo "semantically_changed=true" >> "$GITHUB_OUTPUT"
            echo "Dataset semantic fingerprint changed."
          fi

      - name: Re-verify final dataset and publisher state
        run: |
          node scripts/verify-dataset.mjs
          for directory in public/data.__next public/data.__prev; do
            if [ -e "$directory" ]; then
              echo "::error::Dataset publisher left an unexpected directory: $directory"
              exit 1
            fi
          done
          git diff --check

      - name: Commit and push a semantic dataset change
        if: steps.fingerprint.outputs.semantically_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::Fingerprint changed but no public/data changes were staged."
            exit 1
          fi
          git commit -m "chore(data): refresh Dota dataset ($(date -u +%F))"
          git push origin HEAD:main

      - name: Report semantic no-op
        if: steps.fingerprint.outputs.semantically_changed == 'false'
        run: echo "Dataset semantically unchanged — no commit created."
