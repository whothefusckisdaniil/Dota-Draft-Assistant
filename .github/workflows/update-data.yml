name: Update Dota dataset

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# Never let a scheduled run and a manual dispatch fight over the same dataset.
concurrency:
  group: dota-dataset-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh OpenDota snapshot
        run: node scripts/update-data.mjs

      - name: Commit dataset if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Dataset unchanged — nothing to commit."
          else
            git commit -m "chore(data): refresh OpenDota snapshot ($(date -u +%F))"
            git push
          fi
        # If update-data.mjs failed (non-zero exit), nothing was written and
        # nothing is committed — the previous dataset stays intact.